github_actions:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**.yml'

'pkg: blank-option':
  - changed-files:
      - any-glob-to-any-file:
          - 'assets/blank-option/**'
          - 'packages/blank-option/**'
          - 'tests/*/BlankOption/**'

'pkg: custom-theme':
  - changed-files:
      - any-glob-to-any-file:
          - 'assets/custom-theme/**'
          - 'packages/custom-theme/**'
          - 'tests/*/CustomTheme/**'

assets:
  - changed-files:
      - any-glob-to-any-file:
          - 'assets/**'

tests:
  - changed-files:
      - any-glob-to-any-file:
          - 'tests/**'

enhancement:
  - changed-files:
      - any-glob-to-any-file: '**'
