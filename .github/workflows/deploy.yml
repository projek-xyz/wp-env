name: Deploy
run-name: "deploy(${{ github.event.workflow_run.head_branch }}): deploying `${{ github.event.workflow_run.head_sha }}`"

on:
  workflow_run:
    workflows: [Distribute]
    types: [completed]
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  static:
    name: Static Pages
    if: github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/static.yml
    with:
      ref: ${{ github.event.workflow_run.head_sha }}
      dist-dir: assets/dist

    permissions:
      pages: write
      id-token: write
