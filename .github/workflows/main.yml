name: CI
run-name: "ci(${{ github.ref_name }}): quality check against `${{ github.sha }}`"

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

env:
  PHP_VERSION: ${{ vars.PHP_VERSION || '8.2' }}
  WP_VERSION: ${{ vars.WP_VERSION || '7.0' }}

jobs:
  prepare:
    name: Prepare
    uses: projek-xyz/actions/.github/workflows/prepare.yml@c0e4dfe37fa0e21d80f40ac5f6f9b33de0cbbe0e
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    permissions:
      pull-requests: write
      contents: read

  lint:
    name: Linting
    runs-on: ubuntu-latest
    needs: prepare

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          tools: composer

      - name: Set up Composer cache
        uses: actions/cache@v5
        with:
          path: ${{ needs.prepare.outputs.composer-cache-dir }}
          key: composer-php${{ env.PHP_VERSION }}-wp${{ env.WP_VERSION }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-php${{ env.PHP_VERSION }}-wp${{ env.WP_VERSION }}-

      - name: Install dependencies
        run: |
          composer update --ansi --no-interaction --no-progress --prefer-dist

      - name: Lint
        env:
          SHOULD_BUILD: ${{ needs.prepare.outputs.should-build }}
          SHOULD_DEPLOY: ${{ needs.prepare.outputs.should-deploy }}
          SHOULD_TESTS: ${{ needs.prepare.outputs.should-tests }}
        run: |
          composer lint

          echo "$SHOULD_BUILD"
          echo "$SHOULD_DEPLOY"
          echo "$SHOULD_TESTS"

  units:
    name: "Unit test: PHP-${{ matrix.php }} WP-${{ vars.WP_VERSION || '7.0' }}"
    runs-on: ubuntu-latest
    needs: [prepare, lint]

    env:
      DB_NAME: ${{ github.repository_owner }}
      DB_USER: ${{ github.repository_owner }}
      DB_PASS: secret
      PHP_VERSION: ${{ matrix.php }}

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ env.DB_PASS }}
          MYSQL_DATABASE: ${{ env.DB_NAME }}
          MYSQL_USER: ${{ env.DB_USER }}
          MYSQL_PASSWORD: ${{ env.DB_PASS }}
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
        ports:
          - 3306:3306

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: xdebug
          tools: composer, wp

      - name: Set up Composer cache
        uses: actions/cache@v5
        with:
          path: ${{ needs.prepare.outputs.composer-cache-dir }}
          key: composer-php${{ env.PHP_VERSION }}-wp${{ env.WP_VERSION }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-php${{ env.PHP_VERSION }}-wp${{ env.WP_VERSION }}-

      - name: Set up WP-CLI cache
        uses: actions/cache@v5
        with:
          path: ${{ needs.prepare.outputs.wpcli-cache-dir }}
          key: wpcli-php${{ env.PHP_VERSION }}-wp${{ env.WP_VERSION }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: wpcli-php${{ env.PHP_VERSION }}-wp${{ env.WP_VERSION }}-

      - name: Install dependencies
        run: |
          composer update --ansi --no-interaction --no-progress --prefer-dist

      - name: Set up WordPress
        shell: bash
        env:
          DB_HOST: 127.0.0.1:${{ job.services.mysql.ports['3306'] }}
          SITE_PLUGINS: blocksy-companion
          SITE_THEMES: blocksy
          SKIP_MEDIA: 1
          SKIP_OPTIONS: 1
        run: |
          scripts/init-wp.sh

      - name: Unit Test
        run: |
          composer test:unit --ansi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: tests/reports
          env_vars: PHP_VERSION,WP_VERSION
          report_type: coverage

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: tests/reports
          env_vars: PHP_VERSION,WP_VERSION
          report_type: test_results
