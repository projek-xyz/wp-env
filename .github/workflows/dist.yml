name: Distribution

on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  archiving:
    name: Archiving
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    outputs:
      archive-dir: ${{ steps.make-archive.outputs.archive-dir }}
      for-release: ${{ steps.make-archive.outputs.for-release }}
      has-files: ${{ steps.make-archive.outputs.has-files }}
      release-version: ${{ steps.make-archive.outputs.release-version }}

    env:
      DB_NAME: ${{ github.repository_owner }}
      DB_USER: ${{ github.repository_owner }}
      DB_PASS: secret
      PHP_VERSION: '8.1'
      WP_VERSION: '6.9'

    permissions:
      id-token: write

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ env.DB_PASS }}
          MYSQL_DATABASE: ${{ env.DB_NAME }}
          MYSQL_USER: ${{ env.DB_USER }}
          MYSQL_PASSWORD: ${{ env.DB_PASS }}
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
        ports:
          - 3306:3306

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        ref: ${{ github.event.workflow_run.head_sha }}

    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ env.PHP_VERSION }}
        coverage: none
        tools: composer, wp

    - name: Retrieve cache dirs
      id: caches
      run: |
        echo "composer-dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
        echo "wpcli-dir=$(wp cli info --format=json | jq -r '.wp_cli_cache_dir_path')" >> $GITHUB_OUTPUT

    - name: Set up Composer cache
      uses: actions/cache@v5
      with:
        path: ${{ steps.caches.outputs.composer-dir }}
        key: composer-php${{ env.PHP_VERSION }}-wp${{ env.WP_VERSION }}-${{ hashFiles('**/composer.lock') }}
        restore-keys: composer-php${{ env.PHP_VERSION }}-wp${{ env.WP_VERSION }}-

    - name: Set up WP-CLI cache
      uses: actions/cache@v5
      with:
        path: ${{ steps.caches.outputs.wpcli-dir }}
        key: wpcli-php${{ env.PHP_VERSION }}-wp${{ env.WP_VERSION }}-${{ hashFiles('**/composer.lock') }}
        restore-keys: wpcli-php${{ env.PHP_VERSION }}-wp${{ env.WP_VERSION }}-

    - name: Install dependencies
      run: |
        composer update --ansi --no-interaction --no-progress --prefer-dist

    - name: Set up WordPress
      shell: bash
      env:
        DB_HOST: 127.0.0.1:${{ job.services.mysql.ports['3306'] }}
        SITE_PLUGINS: blocksy-companion
        SITE_THEMES: blocksy
      run: |
        scripts/init-wp.sh

    - name: Make dist archive
      id: make-archive
      env:
        DIST_DIR: assets/dist
        COMMIT_MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
        FOR_RELEASE: ${{ startsWith(github.event.workflow_run.head_commit.message, 'chore(release):') && '1' || '0' }}
        FORWARD_DB_PORT: ${{ job.services.mysql.ports['3306'] }}
      run: |
        scripts/make-dist.sh

        HAS_FILES=$([[ `ls -1 $DIST_DIR/* 2>/dev/null | wc -l` != 0 ]] && echo "1" || echo "0")

        echo "has-files=$HAS_FILES" >> $GITHUB_OUTPUT
        echo "for-release=$FOR_RELEASE" >> $GITHUB_OUTPUT
        echo "archive-dir=$DIST_DIR" >> $GITHUB_OUTPUT
        echo "release-version=$RELEASE_VERSION" >> $GITHUB_OUTPUT

    - name: Store archive
      uses: actions/upload-artifact@v7
      if: steps.make-archive.outputs.has-files == '1'
      with:
        overwrite: true
        name: release-archives
        path: ${{ steps.make-archive.outputs.archive-dir }}

  uploads:
    name: Uploads
    needs: archiving
    runs-on: ubuntu-latest
    if: |-
      needs.archiving.outputs.for-release == '1' &&
      needs.archiving.outputs.has-files == '1' &&
      needs.archiving.outputs.release-version != ''

    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Check release
      id: release
      shell: bash
      env:
        ATTEMPTS: ${{ inputs.check_attempts }}
        GITHUB_TOKEN: ${{ github.token }}
        RELEASE_VERSION: ${{ needs.archiving.outputs.release-version }}
      run: |
        AVAILABLE=0

        echo "Release version: $RELEASE_VERSION"

        for a in $(seq 1 "${ATTEMPTS}"); do
          echo "Attempt ${a}/${ATTEMPTS}: waiting for release '$RELEASE_VERSION' to be available..."
          if gh release view "$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "Release $RELEASE_VERSION found!"
            AVAILABLE=1
            break
          fi
          sleep 5s
        done

        if [[ -z "$AVAILABLE" ]]; then
          echo "Release '$RELEASE_VERSION' not found after $ATTEMPTS attempts."
        fi

        echo "is-available=$AVAILABLE" >> $GITHUB_OUTPUT

    - name: Download artifacts
      uses: actions/download-artifact@v8
      if: steps.release.outputs.is-available == '1'
      with:
        name: release-archives
        path: ${{ needs.archiving.outputs.archive-dir }}
        run-id: ${{ github.event.workflow_run.id }}
        github-token: ${{ github.token }}

    - name: Upload assets
      if: steps.release.outputs.is-available == '1'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        RELEASE_VERSION: ${{ needs.archiving.outputs.release-version }}
        ARCHIVE_DIR: ${{ needs.archiving.outputs.archive-dir }}
      run: |
        shopt -s nullglob

        for file in "$ARCHIVE_DIR"/*; do
          [[ -z "$file" || ! -r "$file" ]] && continue

          file_name=$(basename "$file")

          echo -e "::group::Uploading '\e[1;33m$file_name\e[0m'..."

          gh release upload "$RELEASE_VERSION" "$file" --clobber
          echo -e "\e[1;32mSuccesse[0m: '\e[1;33m$file\e[0m' uploaded to '\e[1;33m$RELEASE_VERSION\e[0m' release"

          echo '::endgroup::'
        done
