name: Static
run-name: "deploy(${{ github.event.workflow_run.head_branch }}): deploying `${{ github.event.workflow_run.head_sha }}`"

on:
  workflow_call:
    inputs:
      dist-dir:
        description: 'Dist directory'
        default: assets/dist
        type: string
      ref:
        description: The branch, tag or SHA that will be passed to `ref` input in `actions/checkout`
        required: false
        type: string

jobs:
  pages:
    name: GitHub Pages
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'

    environment:
      name: github-pages
      url: ${{ steps.deployed.outputs.page_url }}

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.ref }}

    - name: Download artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: release-archives
        path: ${{ inputs.dist-dir }}
        run-id: ${{ github.event.workflow_run.id }}
        github-token: ${{ github.token }}

    - name: Prepare
      shell: bash
      env:
        DIST_DIR: ${{ inputs.dist-dir }}
      run: |
        shopt -s nullglob

        cp assets/*.{html,png,svg,ico} $DIST_DIR/
        cp assets/.nojekyll $DIST_DIR/

    - name: Store
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      with:
        path: ${{ inputs.dist-dir }}
        include-hidden-files: true

    - name: Deploy
      id: deployed
      uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      with:
        token: ${{ github.token }}
